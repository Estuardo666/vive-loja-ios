workflows:
  ios-simulator:
    name: Vive Loja iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      xcode: 26.2
      vars:
        VL_API_BASE_URL: https://viveloja.com/api/mobile/v1
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Install SwiftLint
        script: |
          brew install swiftlint
      - name: Generate project
        script: |
          xcodegen generate
      - name: Lint Swift
        script: |
          swiftlint lint --quiet
      - name: Build unsigned simulator app
        script: |
          xcodebuild build \
            -project ViveLoja.xcodeproj \
            -scheme ViveLoja \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Run XCTest and UI tests
        script: |
          xcodebuild test \
            -project ViveLoja.xcodeproj \
            -scheme ViveLoja \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_TESTABILITY=YES
    artifacts:
      - TestResults.xcresult
      - DerivedData/Logs/Test

  ios-unsigned-ipa:
    name: Vive Loja iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      xcode: 26.2
      vars:
        VL_API_BASE_URL: https://viveloja.com/api/mobile/v1
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Install SwiftLint
        script: |
          brew install swiftlint
      - name: Generate project
        script: |
          xcodegen generate
      - name: Lint Swift
        script: |
          swiftlint lint --quiet
      - name: Build unsigned device archive
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          for attempt in 1 2; do
            log_path="$CM_BUILD_DIR/build/archive-$attempt.log"
            set +e
            xcodebuild archive \
              -project ViveLoja.xcodeproj \
              -scheme ViveLoja \
              -configuration Production \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$CM_BUILD_DIR/build/DerivedData-$attempt" \
              -archivePath "$CM_BUILD_DIR/build/ViveLoja-$attempt.xcarchive" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" 2>&1 | tee "$log_path"
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "$build_status" -eq 0 ]; then
              printf '%s' "$attempt" > "$CM_BUILD_DIR/build/archive-attempt.txt"
              break
            fi
            if [ "$attempt" -eq 2 ] || ! grep -Fq 'The Xcode build system has crashed' "$log_path"; then
              exit "$build_status"
            fi
            echo "Xcode build service crashed; retrying once with fresh build outputs."
          done
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          attempt=$(cat "$CM_BUILD_DIR/build/archive-attempt.txt")
          app_path="$CM_BUILD_DIR/build/ViveLoja-$attempt.xcarchive/Products/Applications/Vive Loja.app"
          ipa_root="$CM_BUILD_DIR/build/unsigned-ipa"
          ipa_path="$CM_BUILD_DIR/build/ViveLoja-unsigned.ipa"

          test -d "$app_path"
          mkdir -p "$ipa_root/Payload"
          cp -R "$app_path" "$ipa_root/Payload/"
          (cd "$ipa_root" && zip -qry "$ipa_path" Payload)
    artifacts:
      - build/ViveLoja-unsigned.ipa
