name: ViveLoja
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Staging: debug
  Release: release
  Production: release
configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig
  Production: Config/Production.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    # Fallback for any configuration that does not set it; the xcconfigs do.
    VL_APS_ENVIRONMENT: development
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ViveLoja:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ViveLoja
    resources:
      - path: ViveLoja/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viveloja.app
        PRODUCT_NAME: Vive Loja
        PRODUCT_MODULE_NAME: ViveLoja
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vive Loja
        INFOPLIST_KEY_NSCameraUsageDescription: Vive Loja usa la cámara para publicar fotos.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Vive Loja usa tu ubicación para mostrar lugares cercanos.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Vive Loja usa tus fotos para publicar contenido.
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: Vive Loja puede recordarte eventos guardados.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_VL_API_BASE_URL: "$(VL_API_BASE_URL)"
        INFOPLIST_KEY_VL_APS_ENVIRONMENT: "$(VL_APS_ENVIRONMENT)"
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: ViveLoja/ViveLoja.entitlements
    scheme:
      testTargets:
        - ViveLojaTests
        - ViveLojaUITests
      gatherCoverageData: true
  ViveLojaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ViveLojaTests
    dependencies:
      - target: ViveLoja
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viveloja.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vive Loja.app/Vive Loja"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ViveLojaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ViveLojaUITests
    dependencies:
      - target: ViveLoja
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viveloja.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ViveLoja
