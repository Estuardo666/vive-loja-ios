name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Install SwiftLint
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install swiftlint

      - name: Generate project
        run: xcodegen generate

      - name: Lint Swift
        run: swiftlint lint --quiet

      - name: Build
        run: >-
          xcodebuild build-for-testing
          -project ViveLoja.xcodeproj
          -scheme ViveLoja
          -configuration Production
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          ENABLE_TESTABILITY=YES

      - name: Test
        run: >-
          xcodebuild test-without-building
          -project ViveLoja.xcodeproj
          -scheme ViveLoja
          -configuration Production
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2'
          -derivedDataPath DerivedData
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Export screenshot attachments
        if: always()
        continue-on-error: true
        run: >-
          xcrun xcresulttool export attachments
          --path TestResults.xcresult
          --output-path ExportedScreenshots

      - name: Verify snapshot baseline
        if: success()
        run: >-
          xcrun swift scripts/verify_snapshots.swift
          --baseline ViveLojaUITests/Snapshots
          --exported ExportedScreenshots

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            DerivedData/Logs/Test

      - name: Upload exported screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          if-no-files-found: ignore
          path: ExportedScreenshots
